# Build the extension ONCE, from ONE source tree, and publish to all THREE stores.
# Chrome and Edge share a byte-identical MV3 zip (Edge is Chromium); Firefox gets an
# .xpi built by tools/build-firefox.mjs from the same extension/ directory with a
# derived manifest (tools/firefox-manifest.mjs) — one codebase, one tag, three stores,
# always the same version number. These steps are DECOUPLED so you can test before
# publishing:
#
#   • Push a tag `ext-v*`  → builds the zip + creates the GitHub Release ONLY.
#                            Nothing goes to either store. Download the zip from
#                            the release (or dl.chatpanel.net) and test it.
#   • Run this workflow manually (workflow_dispatch) → publishes to the store(s)
#                            you selected (publish_chrome / publish_edge /
#                            publish_firefox). Each store is gated independently on
#                            BOTH its input AND its secrets being configured, so you
#                            can enable one store now and the others later with no
#                            code change.
#
# So the flow is: tag → test the GitHub build → manually dispatch to publish.
# The version that ships is whatever is in extension/manifest.json.
#
# The release attaches BOTH a versioned zip (chatpanel-extension-v<x>.zip) and a
# stable-named zip (chatpanel-extension.zip), plus the Firefox pair. The stable names
# power permanent download URLs that never change between versions:
#
#   https://github.com/chatpanel/chatpanel-extension/releases/latest/download/chatpanel-extension.zip
#   https://github.com/chatpanel/chatpanel-extension/releases/latest/download/chatpanel-firefox.xpi
#
# (dl.chatpanel.net/extension.zip and dl.chatpanel.net/firefox.xpi proxy those.)
name: Release extension

on:
  push:
    tags: ['ext-v*']
  workflow_dispatch:
    inputs:
      publish_chrome:
        description: 'Publish to the Chrome Web Store'
        type: boolean
        default: true
      publish_edge:
        description: 'Publish to Microsoft Edge Add-ons'
        type: boolean
        default: true
      publish_firefox:
        description: 'Publish to addons.mozilla.org (Firefox)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      EDGE_KEY: ${{ secrets.EDGE_API_KEY }}
      AMO_KEY: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fail fast if the manifest carries anything that breaks Edge before we
      # publish to either store (the same preflight CI runs on every push).
      - name: Edge preflight
        run: npm run verify:edge

      # Same gate for Gecko: a manifest the Firefox build would emit but AMO rejects
      # (or a shared file that reached for a Chromium-only API) fails here, before
      # anything is uploaded to any store.
      - name: Firefox preflight
        run: npm run verify:firefox

      - name: Package extension
        run: node tools/package-extension.mjs

      # Same source tree, Firefox manifest + the AMO source archive.
      - name: Package Firefox add-on
        run: node tools/build-firefox.mjs

      # Always upload the built zips as a run artifact, so a `workflow_dispatch`
      # (publish=false) build can be downloaded and sanity-checked WITHOUT a tag
      # or a Web Store submission. Tagged runs also get this, in addition to the
      # attached GitHub Release below.
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatpanel-extension-zip
          path: dist/chatpanel-extension*.zip
          if-no-files-found: error

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatpanel-firefox
          path: |
            dist/chatpanel-firefox*.zip
            dist/chatpanel-firefox.xpi
          if-no-files-found: error

      - name: Publish to Chrome Web Store
        id: chrome
        continue-on-error: true
        # Decoupled from tagging: ONLY a manual workflow_dispatch with
        # publish_chrome=true submits to the store. A tag push builds + releases
        # but never publishes.
        if: ${{ env.CWS_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.publish_chrome }}
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          set -euo pipefail
          echo "Requesting access token…"
          # NOT `curl -sf`: -f exits 22 with the body discarded, so an expired or revoked
          # grant showed up in CI as a bare exit code and nothing else. Google says exactly
          # what is wrong in the response body — print it.
          TOK_RES=$(curl -s -w '\n%{http_code}' -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token")
          TOK_CODE=$(printf '%s' "$TOK_RES" | tail -n1)
          TOK_BODY=$(printf '%s' "$TOK_RES" | sed '$d')
          if [ "$TOK_CODE" -ge 400 ]; then
            ERR=$(printf '%s' "$TOK_BODY" | jq -r '.error // "unknown"')
            DESC=$(printf '%s' "$TOK_BODY" | jq -r '.error_description // ""')
            echo "::error::OAuth token request failed (HTTP $TOK_CODE): $ERR — $DESC"
            case "$ERR" in
              invalid_grant)  echo "::notice::The refresh token is expired or revoked. Mint a new one and update CHROME_REFRESH_TOKEN." ;;
              invalid_client) echo "::notice::CHROME_CLIENT_ID / CHROME_CLIENT_SECRET do not match the OAuth client." ;;
            esac
            exit 1
          fi
          TOKEN=$(printf '%s' "$TOK_BODY" | jq -r .access_token)
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::No access_token in the response"; exit 1; }

          echo "Uploading package…"
          UPLOAD=$(curl -sf -X PUT -T dist/chatpanel-extension.zip \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")
          echo "$UPLOAD"
          echo "$UPLOAD" | jq -e '.uploadState == "SUCCESS"' >/dev/null \
            || { echo "Upload failed"; exit 1; }

          echo "Publishing…"
          # Capture the body + status so a publish rejection is visible instead of a
          # bare curl exit code. Common causes the upload can't auto-publish past:
          #   • mandatory Privacy practices info not entered/submitted in the
          #     dashboard (single purpose, permission justifications, data usage)
          #   • a newly-added permission (e.g. debugger/identity/downloads) awaiting
          #     review/submission from the dashboard
          PUB=$(curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
          CODE=$(printf '%s' "$PUB" | tail -n1)
          BODY=$(printf '%s' "$PUB" | sed '$d')
          echo "HTTP $CODE"
          echo "$BODY"
          if [ "$CODE" -ge 400 ] || echo "$BODY" | jq -e '.error // (.status | index("ITEM_NOT_UPDATABLE") // .status | index("NOT_AUTHORIZED"))' >/dev/null 2>&1; then
            echo "::error::Web Store publish was rejected (HTTP $CODE). The new build UPLOADED fine, but couldn't auto-publish — finish it in the dashboard. Usually either the mandatory Privacy practices info needs to be entered/submitted (single purpose, permission justifications, data usage), or a newly-added permission needs review. See the response body above for the exact reason."
            exit 1
          fi
          echo "Submitted for review."

      - name: Publish to Microsoft Edge Add-ons
        id: edge
        continue-on-error: true
        # Same decoupling as Chrome: ONLY a manual workflow_dispatch with
        # publish_edge=true submits. Uploads the SAME dist/chatpanel-extension.zip
        # via the Edge Add-ons Update REST API v1.1 (tools/publish-edge.mjs).
        if: ${{ env.EDGE_KEY != '' && github.event_name == 'workflow_dispatch' && inputs.publish_edge }}
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: node tools/publish-edge.mjs

      - name: Publish to addons.mozilla.org
        id: amo
        # Same decoupling as the other two stores. Uploads dist/chatpanel-firefox.zip
        # AND dist/chatpanel-firefox-sources.zip (AMO requires the source for the
        # generated vendor bundles) via the v5 submission API — tools/publish-amo.mjs.
        if: ${{ env.AMO_KEY != '' && github.event_name == 'workflow_dispatch' && inputs.publish_firefox }}
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON_ID: ${{ secrets.AMO_ADDON_ID }}
        run: node tools/publish-amo.mjs

      - name: Chrome skip notice
        if: ${{ env.CWS_TOKEN == '' }}
        run: echo "::notice::Built the zip but skipped Chrome Web Store publish — set CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN to enable."

      - name: Edge skip notice
        if: ${{ env.EDGE_KEY == '' }}
        run: echo "::notice::Built the zip but skipped Microsoft Edge Add-ons publish — set EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY (Partner Center → Publish API) to enable."

      - name: Firefox skip notice
        if: ${{ env.AMO_KEY == '' }}
        run: echo "::notice::Built the .xpi but skipped the addons.mozilla.org publish — set AMO_JWT_ISSUER and AMO_JWT_SECRET (AMO → Tools → Manage API Keys) to enable. The FIRST listed version must be created once through the AMO web UI; after that this workflow owns every release."

      - name: Attach zips to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Both the versioned zip AND the stable name (for the permanent
          # /releases/latest/download/chatpanel-extension.zip link).
          files: |
            dist/chatpanel-extension.zip
            dist/chatpanel-extension-*.zip
            dist/chatpanel-firefox.xpi
            dist/chatpanel-firefox-*.zip

      # WHAT ACTUALLY SHIPPED.
      #
      # Each store publishes with continue-on-error so one store's problem cannot block the
      # other two — which is right, and which also means the run's green tick says nothing
      # about whether anything reached a store. It has already misled once: a Chrome publish
      # rejected with HTTP 400 ("provide mandatory privacy information") sat under a
      # successful run, and the release was reported as done.
      #
      # So the outcome of each requested store is printed, and a store that was ASKED to
      # publish and did not is a failed run. Skipped-because-not-requested stays quiet;
      # skipped-because-no-credentials is called out, because "nothing happened" and "we have
      # no key for that store" are different problems with the same silence.
      - name: Release summary
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          CHROME: ${{ steps.chrome.outcome }}
          EDGE: ${{ steps.edge.outcome }}
          AMO: ${{ steps.amo.outcome }}
        run: |
          fail=0
          line() {
            local store="$1" want="$2" got="$3" key="$4"
            if [ "$want" != "true" ]; then echo "· $store — not requested"; return; fi
            case "$got" in
              success) echo "✅ $store — submitted";;
              skipped) echo "⚠️  $store — SKIPPED: no credentials configured ($key)"; fail=1;;
              *)       echo "❌ $store — publish did not complete (see the step log)"; fail=1;;
            esac
          }
          {
            echo "### Store publish results"
            echo ''
            line "Chrome Web Store" "${{ inputs.publish_chrome }}" "$CHROME" "CHROME_REFRESH_TOKEN"
            line "Microsoft Edge"   "${{ inputs.publish_edge }}"   "$EDGE"   "EDGE_API_KEY"
            line "addons.mozilla.org" "${{ inputs.publish_firefox }}" "$AMO" "AMO_JWT_SECRET"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$fail" = 1 ]; then
            echo "::error::A store that was asked to publish did not. The build is fine and the GitHub Release is complete — finish the store submission by hand."
            exit 1
          fi
