<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ChatPanel</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --text: #1b1f24; --dim: #6b7280; --accent: #4f46e5; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #16181d; --text: #e8eaed; --dim: #9aa1ac; --accent: #818cf8; }
      }
      /* Deliberately tiny. On desktop this page is a flash before the panel opens, so it
         must not paint a large empty popup; on a phone it is a full sheet, so it must
         still read as ChatPanel rather than a blank white page. */
      html, body { margin: 0; }
      body {
        min-width: 200px; padding: 14px 16px; background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px;
        display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
      }
      img { width: 32px; height: 32px; }
      p { margin: 0; color: var(--dim); font-size: 12.5px; }
      button {
        display: none; font: inherit; font-weight: 600; cursor: pointer;
        padding: 10px 16px; min-height: 44px; border: 0; border-radius: 10px;
        background: var(--accent); color: #fff;
      }
      body.needs-tap button { display: block; }
    </style>
  </head>
  <body>
    <img src="assets/icon48.png" alt="" />
    <p id="status">Opening ChatPanel…</p>
    <button id="open" type="button">Open ChatPanel</button>
    <script type="module" src="js/panel-launcher.js"></script>
  </body>
</html>
